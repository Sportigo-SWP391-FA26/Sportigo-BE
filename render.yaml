services:
  - type: web
    name: sportigo-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Không tự chạy migration khi restart/deploy. Thay đổi schema phải được
    # sao lưu và triển khai có kiểm soát bằng một thao tác riêng.
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_CONNECTION_LIMIT
        value: 5
      - key: DB_POOL_TIMEOUT
        value: 10
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: GMAIL_WEBHOOK_URL
        sync: false
      - key: GMAIL_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false

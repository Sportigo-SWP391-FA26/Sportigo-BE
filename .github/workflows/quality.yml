name: Backend quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sport_center_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sport_center_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Chỉ trỏ tới Postgres tạm trong job CI, không dùng database thật
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sport_center_ci_app
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sport_center_ci_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sport_center_ci_test
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      VNPAY_TMN_CODE: TESTSPORTIGO
      VNPAY_HASH_SECRET: ci-vnpay-secret-used-only-for-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
